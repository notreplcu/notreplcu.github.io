<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RNG Bruteforcer</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Source Sans 3", "Source Sans Pro", system-ui, sans-serif;
  }
  .card {
    background: #fff;
    border-radius: 8px;
    width: 625px;
    max-width: 94vw;
    padding: 55px 40px 40px;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: 1fr 1fr;
    row-gap: 22px;
    align-items: center;
  }
  .stat { text-align: center; }
  .label { color: #aaa; font-size: 20px; }
  .value { color: #000; font-size: 38px; line-height: 1.2; }
  .field { text-align: center; }
  .field .label { position: relative; padding-bottom: 6px; }
  .field .label::after {
    content: "";
    display: block;
    width: 100px;
    height: 5px;
    background: #e3e3e3;
    border-radius: 3px;
    margin: 2px auto 0;
  }
  .field input {
    width: 200px;
    box-sizing: border-box;
    background: #f7f7f7;
    border: none;
    border-radius: 8px;
    text-align: center;
    font: inherit;
    font-size: 38px;
    padding: 4px 0;
    color: #000;
    outline: none;
  }
  .field input:disabled { color: #777; }
  .actions { grid-column: 1 / -1; text-align: center; margin-top: 30px; }
  button {
    background: #00aaff;
    color: #fff;
    border: none;
    border-radius: 6px;
    width: 200px;
    height: 50px;
    font: inherit;
    font-size: 38px;
    cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
  <div class="card">
    <div class="stat">
      <div class="label">Tries</div>
      <div class="value" id="tries">0</div>
    </div>
    <div class="field">
      <div class="label">Min</div>
      <input id="min" type="number" value="1" disabled>
    </div>

    <div class="stat">
      <div class="label">Duplicates</div>
      <div class="value" id="dupes">0</div>
    </div>
    <div class="field">
      <div class="label">Max</div>
      <input id="max" type="number" value="10" min="1">
    </div>

    <div class="actions">
      <button id="check">Check</button>
    </div>
  </div>

<script>
  const maxInput = document.getElementById("max");
  const triesEl = document.getElementById("tries");
  const dupesEl = document.getElementById("dupes");
  const btn = document.getElementById("check");

  btn.addEventListener("click", () => {
    const max = Math.floor(Number(maxInput.value));
    if (!Number.isFinite(max) || max < 1) return;

    btn.disabled = true;
    let tries = 0;
    let dupes = 0;
    const seen = new Set(); // O(1) lookup instead of a linear table.find

    // Run in chunks so the page doesn't freeze on big max values
    function step() {
      const end = performance.now() + 12;
      while (performance.now() < end) {
        tries++;
        const r = Math.floor(Math.random() * max) + 1;
        if (seen.has(r)) dupes++;
        else seen.add(r);
        if (r === 1) {
          triesEl.textContent = tries;
          dupesEl.textContent = dupes;
          btn.disabled = false;
          return;
        }
      }
      triesEl.textContent = tries;
      dupesEl.textContent = dupes;
      setTimeout(step, 0);
    }
    step();
  });
</script>
</body>
</html>
